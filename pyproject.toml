# =============================================================================
# Configuração do projeto (PEP 621) — gerenciado com uv.
#
#   [project]                 metadados + dependência de runtime (curses no Windows)
#   [dependency-groups] dev   ferramentas de qualidade (uv instala por padrão)
#   [tool.*]                  config de ruff, black, mypy e pytest
#
# As versões exatas do grafo (runtime + dev) ficam travadas no uv.lock (gerado
# por `uv lock`). Commite pyproject.toml e uv.lock juntos.
# =============================================================================

[project]
name = "jogo-da-cobrinha"
version = "0.1.0"
description = "Jogo da Cobrinha (Snake) em Python com curses — exercício educacional de lógica e manipulação de listas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryan Morais" }]
dependencies = [
    # A stdlib do Python no Windows não inclui o módulo `curses`; este pacote
    # o supre. Em Linux/macOS o `curses` já vem na stdlib, por isso o marcador.
    "windows-curses>=2.4.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Script educacional, não uma lib a ser empacotada/instalada como pacote.
package = false

# --- Linter (substitui o flake8 + isort, lê o pyproject nativamente) ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade
select = ["E", "W", "F", "I", "UP"]

# --- Formatador ---
[tool.black]
line-length = 88
target-version = ["py312"]

# --- Type checker ---
[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "tests"]

# --- Testes ---
[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
