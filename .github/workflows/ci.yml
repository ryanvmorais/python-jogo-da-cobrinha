# Pipeline de CI (GitHub Actions). Espelha o portao de qualidade local
# (ruff -> black --check -> mypy -> pytest) para que um check verde no PR
# signifique o mesmo que um clone limpo passando.
#
# As Actions ficam fixadas pelo SHA do commit, com a versao no comentario: uma tag
# pode ser movida depois de publicada, o SHA nao. O Dependabot atualiza os dois juntos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos do mesmo ref: um push novo no PR mata o run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    # ubuntu-26.04: o `curses` da stdlib do Linux cobre a dependencia de
    # runtime sem precisar do windows-curses (marcado so para sys_platform
    # == 'win32' no pyproject.toml).
    runs-on: ubuntu-26.04
    # Um run leva poucos minutos; o teto evita que um job travado gaste a cota.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 e o piso (requires-python); 3.14 e 3.15 sao as estaveis mais novas.
        python-version: ["3.12", "3.14", "3.15"]
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sincroniza o ambiente (runtime + grupo dev)
        run: uv sync --frozen

      - name: Ruff (lint + ordem de imports)
        run: uv run ruff check .

      - name: Black (formatacao)
        run: uv run black --check .

      - name: Mypy (tipos)
        run: uv run mypy

      - name: Pytest (suite completa)
        run: uv run pytest
